name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Includes the task suite's own checks: every task must validate, render,
      # and leave real headroom from its starting document.
      - run: npm test
      # The whole pipeline end to end against a scripted agent — no API key,
      # no spending, but it exercises the matrix, scoring and report writing.
      - run: npm run cli -- run --dry-run --tasks arrange --repeats 1 --out "$RUNNER_TEMP/dry"
