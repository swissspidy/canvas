name: CI

on:
  # Pull requests cover branch work; `main` is covered on push so the default
  # branch always has a result of its own.
  push:
    branches: [main]
  pull_request:

# Nothing in this workflow writes anything back. Stated explicitly, because the
# default token is otherwise granted whatever the repository's default is.
permissions:
  contents: read

# A newer push to the same ref supersedes the one in flight. Kept off `main`,
# where every commit's result is worth having.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Typecheck, tests and pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step here pushes, so the checkout must not leave a usable token
          # in .git/config for the rest of the job to find.
          persist-credentials: false

      # The version lives in .nvmrc, so contributors and CI resolve the same one.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Includes the task suite's own checks: every task must validate, render,
      # and leave real headroom from its starting document.
      - name: Test
        run: npm test

      # The whole pipeline end to end against a scripted model — no API key, no
      # spending, but it exercises the matrix, the loop, scoring and the report.
      - name: Dry-run the sweep
        run: npm run cli -- run --dry-run --tasks arrange --repeats 1 --out "$RUNNER_TEMP/dry"

      # Catches the browser bundle breaking, which is the main regression risk
      # for the WebMCP host.
      - name: Build the browser bundle
        run: npm run build:web

      - name: WebMCP end-to-end
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$CHROME" ]; then
            CHROMIUM_PATH="$CHROME" npm run e2e:webmcp
          else
            echo "No Chrome on this runner; skipping the browser end-to-end."
          fi

  workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pipx ships on the runner image, so this needs no action of its own.
      # Pinned: a zizmor upgrade should be a deliberate commit, not a surprise
      # red build on an unrelated pull request.
      - name: zizmor
        run: pipx run zizmor==1.30.1 --persona=pedantic --format=plain .github/workflows
