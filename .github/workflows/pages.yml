name: Pages

on:
  # The results site is published from `main` only, so what's live always
  # matches a merged state of the repository.
  push:
    branches: [main]
    paths:
      - site/**
      - .github/workflows/pages.yml
  workflow_dispatch:

# Nothing by default. The one job states what it needs.
permissions: {}

# One deployment at a time. An in-flight one is allowed to finish rather than
# being cancelled half way through publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish site/
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the repository
      pages: write # publish the deployment
      id-token: write # prove to Pages that the deployment came from this run
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step here pushes, so the checkout must not leave a usable token
          # in .git/config for the rest of the job to find.
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # The site is static HTML and PNGs. There is no build step.
      - name: Upload site/
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
